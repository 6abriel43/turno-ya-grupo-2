{% extends "base.html" %}

{% block title %}Ingresar - TurnoYa{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-4 text-center">Ingresar</h1>

        {% if form.errors %}
          <div class="alert alert-danger" role="alert">
            Usuario o contrasena incorrectos.
          </div>
        {% endif %}

        <form method="post" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
            {{ form.username }}
          </div>

          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label">Contrasena</label>
            {{ form.password }}
          </div>

          <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
